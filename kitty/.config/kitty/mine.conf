# Shell integration
shell_integration enabled

 ============================================================================
# PERFORMANCE OPTIMIZATION
# ============================================================================
# Lower repaint delay for smoother rendering (default: 10ms)
repaint_delay 10

# Reduce input lag for better responsiveness (default: 3ms)
input_delay 3

# Sync screen redraws to monitor refresh rate
sync_to_monitor yes

# ============================================================================
# WINDOW SIZING & BEHAVIOR
# ============================================================================
# Don't remember previous window size
remember_window_size no

# Default window dimensions (for quake-style terminal)
initial_window_width 800
initial_window_height 500

# Start in windowed mode (not fullscreen)
startup_mode windowed

# Dim inactive window text to 70% opacity
inactive_text_alpha 0.5

# Space around the individual windows
window_margin_width 2
window_padding_width 2


# ============================================================================
# WINDOW APPEARANCE
# ============================================================================

# Apply slight blur to background
background_blur 1

# Thin 1-point border around windows
window_border_width 1pt

# Use minimal border style (no thick decorations)
draw_minimal_borders yes

# Window transparency
background_opacity 0.85

# Border colors for focused/unfocused windows
inactive_border_color #282828

# --- Content --- 

# --- Font Settings ---
font_family      family='SF Mono' postscript_name=SFMono-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# --- URL Settings ---
# color of the underline below urls
url_color #0087bd
# style of the underline below urls
url_style curly

# --- Cursor Settings ---
cursor_shape     underline

# --- Tab configurations ---
tab_bar_edge bottom
tab_bar_margin_width 1.0
tab_bar_margin_height 1.0 0.5
tab_bar_style powerline
tab_powerline_style angled
tab_title_template "{index}: {title}"

# ============================================================================
# KEYBINDS
# ============================================================================

 ================

# --- Custom Window Splitting & Layout Keybindings ---

# Enable auto split direction
enabled_layouts splits:split_axis=auto

# Split window auto (mapped to right/horizontal)
map ctrl+alt+d launch --location=split

# --- Custom Split Navigation ---
# Focus window in the indicated direction
map alt+up neighboring_window top
map alt+down neighboring_window bottom
map alt+left neighboring_window left
map alt+right neighboring_window right

# --- Window navigation
# Move the active window in the indicated direction
map alt+shift+up move_window up
map alt+shift+left move_window left
map alt+shift+right move_window right
map alt+shift+down move_window down

# --- Resizing ---
# interactive resizing
map ctrl+shift+r start_resizing_window
# manual resizing
map ctrl+shift+alt+left resize_window narrower
map ctrl+shift+alt+right resize_window wider
map ctrl+shift+alt+down resize_window shorter
map ctrl+shift+alt+up resize_window taller

# --- General window management --- 

# Fullscreen
map f11 toggle_fullscreen


